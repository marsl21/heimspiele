<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Heimspiele FC Rheineck</title>
  <style>
    :root{--blau:#123f8b;--blau-dunkel:#0d326f;--rot:#d21f3c;--text:#172033;--muted:#748096;--bg:#f2f5f9;--card:#fff;--line:#dfe5ed;--hero:linear-gradient(135deg,#17458f 0%,#713175 48%,#dc1832 100%);--shadow:0 10px 28px rgba(20,39,75,.09);--shadow-hover:0 14px 34px rgba(20,39,75,.14)}
    *{box-sizing:border-box}html,body{margin:0;padding:0}body{min-height:100vh;padding:8px 12px 28px;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,#123f8b 0,#123f8b 158px,var(--bg) 158px);-webkit-font-smoothing:antialiased}button{font:inherit}.app{width:min(980px,100%);margin:0 auto}
    .hero{position:relative;overflow:hidden;padding:17px 18px 15px;border-radius:27px;color:#fff;background:var(--hero);box-shadow:0 16px 38px rgba(9,30,66,.22);margin-bottom:28px}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}.hero:before{width:135px;height:135px;right:-38px;top:-45px}.hero:after{width:72px;height:72px;right:30px;top:18px}.hero-top{position:relative;z-index:1;display:flex;align-items:center;gap:14px;margin-bottom:13px}.hero-logo{width:54px;height:54px;flex:0 0 auto;object-fit:contain;padding:4px;border-radius:14px;background:rgba(255,255,255,.12)}.hero-title{margin:0;font-size:clamp(24px,4vw,38px);line-height:1.05;font-weight:850;letter-spacing:-.035em}.hero-sub{margin-top:4px;font-size:13px;font-weight:600;color:rgba(255,255,255,.9)}.hero-chip{position:relative;z-index:1;padding:9px 14px;border-radius:13px;background:rgba(255,255,255,.15);font-size:14px;font-weight:600}
    #spielplan.loading{opacity:.8}.day{margin:0 0 28px}.day-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding:7px 2px 9px;border-bottom:1px solid var(--line)}.day-date{display:flex;align-items:center;gap:9px;min-width:0;font-size:15px;font-weight:850;color:var(--blau-dunkel);letter-spacing:-.01em}.calendar-icon{width:29px;height:29px;display:grid;place-items:center;flex:0 0 auto;border-radius:9px;background:#e9eff8;font-size:14px}.day-meta{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.weather-pill,.count-pill{display:inline-flex;align-items:center;min-height:28px;padding:5px 10px;border-radius:999px;white-space:nowrap;font-size:11px;font-weight:750}.weather-pill{color:#42516a;background:#edf2f8}.weather-pill.pending{opacity:.7}.count-pill{color:#af1932;background:#fdecef}.games{display:grid;grid-template-columns:1fr;gap:10px;padding-top:12px}@media(min-width:720px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}}
    .game-card{display:grid;grid-template-columns:88px 1px minmax(0,1fr) 42px;align-items:center;gap:14px;min-height:118px;padding:16px;border:1px solid rgba(15,35,70,.06);border-radius:20px;background:var(--card);box-shadow:var(--shadow);transition:transform .16s ease,box-shadow .16s ease}.game-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}.time{font-size:21px;line-height:1;font-weight:900;color:var(--blau-dunkel);letter-spacing:-.03em}.type{margin-top:8px;font-size:11px;line-height:1.25;font-weight:800}.type.cup{color:#c61a35}.type.meister{color:#6940a1}.type.default{color:#50617a}.divider{width:1px;height:68px;background:var(--line)}.teams{min-width:0;line-height:1.25}.team{overflow-wrap:anywhere;font-size:15px;font-weight:800;letter-spacing:-.01em}.against{margin:6px 0;color:var(--muted);font-size:11px;font-weight:650}.detail-btn{appearance:none;border:0;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#f2f5f9;color:var(--blau-dunkel);cursor:pointer;font-size:27px;font-weight:350;line-height:1;transition:transform .15s ease,background .15s ease}.detail-btn:hover{transform:translateX(2px);background:#e7edf5}.footer{padding:6px 10px;text-align:center;color:var(--muted);font-size:11px}.error{padding:14px;border:1px solid #ffd4da;border-radius:15px;color:#8c1b2b;background:#fff4f5}
    .modal-backdrop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(5,14,31,.48);backdrop-filter:blur(3px)}.modal-backdrop.show{display:flex}.modal{width:min(520px,100%);max-height:min(760px,92vh);overflow:auto;padding:20px;border-radius:24px;background:#fff;box-shadow:0 30px 80px rgba(0,0,0,.26)}.modal-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:17px}.modal-type{display:flex;align-items:center;gap:8px;color:var(--rot);font-size:16px;font-weight:850}.modal-close{appearance:none;border:0;width:34px;height:34px;border-radius:10px;background:#f1f4f8;color:#667085;cursor:pointer;font-size:22px;line-height:1}.modal-row{display:flex;align-items:flex-start;gap:10px;margin:12px 0;color:#3d4960;font-size:14px;line-height:1.45}.modal-row-icon{width:22px;flex:0 0 22px;text-align:center}.modal-teams{margin:18px 0;padding:15px;border-radius:17px;background:#f5f7fa}.modal-team{font-size:16px;font-weight:850}.modal-against{margin:7px 0;color:var(--muted);font-size:12px}.info-box{margin-top:15px;padding:13px 14px;border-left:4px solid var(--rot);border-radius:11px;background:#fff4f6;color:#424d61;font-size:14px;line-height:1.5;white-space:pre-wrap}.weather-section{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}.weather-title{margin-bottom:13px;font-size:15px;font-weight:850}.weather-main{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:15px;border-radius:18px;background:linear-gradient(135deg,#f4f8fc,#eef3f8)}.weather-big-icon{font-size:43px;line-height:1}.weather-temp{font-size:31px;line-height:1;font-weight:900;color:var(--blau-dunkel);letter-spacing:-.04em}.weather-rain{padding-left:14px;border-left:1px solid #ccd5e1;color:#4d5a70;font-size:12px;line-height:1.4}.weather-rain strong{display:block;color:var(--text);font-size:19px}.weather-text{margin-top:12px;color:#56647a;font-size:13px;line-height:1.5}
    @media(max-width:520px){body{padding:6px 10px 24px}.hero{padding:15px;border-radius:23px;margin-bottom:22px}.hero-logo{width:48px;height:48px}.hero-title{font-size:25px}.hero-chip{font-size:12px}.day-head{align-items:flex-start}.day-date{font-size:14px}.day-meta{gap:5px}.weather-pill,.count-pill{min-height:25px;padding:4px 8px;font-size:10px}.game-card{grid-template-columns:70px 1px minmax(0,1fr) 36px;gap:10px;min-height:108px;padding:14px 12px;border-radius:18px}.time{font-size:18px}.team{font-size:14px}.detail-btn{width:34px;height:34px}.weather-main{grid-template-columns:auto 1fr}.weather-rain{grid-column:1/-1;border-left:0;border-top:1px solid #ccd5e1;padding:10px 0 0}}
  </style>
</head>
<body>
  <div class="app">
    <header class="hero">
      <div class="hero-top"><img src="logo-fcr.png" alt="FC Rheineck Logo" class="hero-logo"><div><h1 class="hero-title">Heimspiele FC Rheineck</h1><div class="hero-sub">Alle kommenden Heimspiele auf einen Blick</div></div></div>
      <div class="hero-chip">Spielplan für Teams, Trainer und Zuschauer</div>
    </header>
    <main id="spielplan" class="loading">Wird geladen…</main>
    <div class="footer">Datenquelle: <code>spiele.csv</code></div>
  </div>
  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true"><div class="modal"><div class="modal-top"><div id="modalType" class="modal-type"></div><button id="modalClose" class="modal-close" aria-label="Schliessen">&times;</button></div><div id="modalContent"></div></div></div>
<script>
const WTAG=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
const CSV_URL="spiele.csv?v="+Date.now();
const WEATHER_URL="https://api.open-meteo.com/v1/forecast?latitude=47.4667&longitude=9.5903&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,precipitation_probability_max&timezone=Europe%2FZurich&forecast_days=16";
const weatherCache={daily:{},hourly:{}};
function escapeHtml(v){return String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#039;")}
function parseCsv(text){text=text.replace(/^\uFEFF/,"");const lines=text.trim().split(/\r?\n/);if(lines.length<2)return[];const header=lines[0].split(";").map(s=>s.trim());const col=n=>header.indexOf(n);const idx={datum:col("Spieldatum"),zeit:col("Zeit"),typ:col("Typ"),heim:col("Heimteam"),gast:col("Gastteam"),info:col("Informationen")!==-1?col("Informationen"):col("Info")};for(const k of["datum","zeit","typ","heim","gast"])if(idx[k]<0)throw new Error("Spalte fehlt: "+k);return lines.slice(1).map(l=>l.split(";")).filter(r=>r.some(v=>v&&v.trim())).map(r=>({datum:(r[idx.datum]||"").trim(),zeit:(r[idx.zeit]||"").trim(),typ:(r[idx.typ]||"").trim(),heim:(r[idx.heim]||"").trim(),gast:(r[idx.gast]||"").trim(),info:idx.info>=0?(r[idx.info]||"").trim():""}))}
function toDateTime(datum,zeit){const[dd,mm,yyyy]=(datum||"").split(".").map(Number);const[hh,min]=(zeit||"00:00").split(":").map(Number);if(!dd||!mm||!yyyy)return null;return new Date(yyyy,mm-1,dd,hh||0,min||0)}
function isoDate(datum){const[dd,mm,yyyy]=(datum||"").split(".").map(Number);if(!dd||!mm||!yyyy)return"";return `${yyyy}-${String(mm).padStart(2,"0")}-${String(dd).padStart(2,"0")}`}
function isFutureOrNow(r){const d=toDateTime(r.datum,r.zeit);return d&&d.getTime()>=Date.now()}
function typeClass(t){const v=(t||"").toLowerCase();if(v.includes("cup"))return"cup";if(v.includes("meister"))return"meister";return"default"}
function weatherIcon(c){if(c===0)return"☀️";if([1,2].includes(c))return"🌤️";if(c===3)return"☁️";if([45,48].includes(c))return"🌫️";if([51,53,55,56,57].includes(c))return"🌦️";if([61,63,65,66,67,80,81,82].includes(c))return"🌧️";if([71,73,75,77,85,86].includes(c))return"🌨️";if([95,96,99].includes(c))return"⛈️";return"🌦️"}
function weatherDescription(c,rain){
  const r=Number(rain);
  if([95,96,99].includes(c))return r>=60?"Gewitter sind wahrscheinlich.":"Gewitter sind möglich.";
  if([71,73,75,77,85,86].includes(c))return r>=60?"Schnee oder Schneeschauer sind wahrscheinlich.":"Schnee oder einzelne Schneeschauer sind möglich.";
  if([61,63,65,66,67,80,81,82].includes(c)){if(r>=70)return"Regen oder Regenschauer sind sehr wahrscheinlich.";if(r>=45)return"Regenschauer sind wahrscheinlich.";return"Einzelne Regenschauer sind möglich.";}
  if([51,53,55,56,57].includes(c))return r>=50?"Leichter Regen oder Nieselregen ist wahrscheinlich.":"Vereinzelt ist leichter Nieselregen möglich.";
  if([45,48].includes(c)){if(r>=40)return"Neblig oder diesig. Einzelne Schauer sind möglich.";return"Neblig oder diesig, voraussichtlich meist trocken.";}
  if(c===3){if(r>=60)return"Überwiegend bewölkt. Regen ist wahrscheinlich.";if(r>=30)return"Überwiegend bewölkt. Einzelne Schauer sind möglich.";return"Überwiegend bewölkt, voraussichtlich meist trocken.";}
  if([1,2].includes(c)){if(r>=60)return"Freundlich mit Wolken. Regenschauer sind wahrscheinlich.";if(r>=25)return"Meist freundlich. Einzelne Schauer sind möglich.";return"Freundlich mit lockeren Wolken. Regen eher unwahrscheinlich.";}
  if(c===0){if(r>=60)return"Sonnig, jedoch sind Regenschauer wahrscheinlich.";if(r>=25)return"Sonnig. Vereinzelt sind kurze Schauer möglich.";return"Sonnig. Regen eher unwahrscheinlich.";}
  if(r>=60)return"Regen ist wahrscheinlich.";if(r>=30)return"Einzelne Schauer sind möglich.";return"Voraussichtlich meist trocken.";
}
function groupByDate(rows){return rows.reduce((m,r)=>{(m[r.datum]||=[]).push(r);return m},{})}
function render(rows){const upcoming=rows.filter(isFutureOrNow).sort((a,b)=>toDateTime(a.datum,a.zeit)-toDateTime(b.datum,b.zeit));if(!upcoming.length)return'<div class="error">Keine kommenden Spiele gefunden.</div>';const grouped=groupByDate(upcoming);const dates=Object.keys(grouped).sort((a,b)=>toDateTime(a,"00:00")-toDateTime(b,"00:00"));let html="";for(const date of dates){const[dd,mm,yyyy]=date.split(".").map(Number);const weekday=WTAG[new Date(yyyy,mm-1,dd).getDay()];const count=grouped[date].length;const iso=isoDate(date);html+=`<section class="day"><div class="day-head"><div class="day-date"><span class="calendar-icon">📅</span><span>${weekday}, ${escapeHtml(date)}</span></div><div class="day-meta"><span class="weather-pill pending" data-weather-date="${iso}">🌦️ Wetter folgt</span><span class="count-pill">${count} ${count===1?"Spiel":"Spiele"}</span></div></div><div class="games">`;for(const g of grouped[date]){html+=`<article class="game-card"><div class="game-time"><div class="time">${escapeHtml(g.zeit)}</div><div class="type ${typeClass(g.typ)}">${escapeHtml(g.typ||"Spiel")}</div></div><div class="divider"></div><div class="teams"><div class="team">${escapeHtml(g.heim)}</div><div class="against">gegen</div><div class="team">${escapeHtml(g.gast)}</div></div><button class="detail-btn" aria-label="Spieldetails öffnen" data-date="${escapeHtml(g.datum)}" data-time="${escapeHtml(g.zeit)}" data-type="${escapeHtml(g.typ||"Spiel")}" data-home="${escapeHtml(g.heim)}" data-away="${escapeHtml(g.gast)}" data-info="${escapeHtml(g.info)}">›</button></article>`}html+=`</div></section>`}return html}
function loadWeather(){fetch(WEATHER_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("Wetterdaten nicht verfügbar");return r.json()}).then(data=>{const daily=data.daily||{};(daily.time||[]).forEach((date,i)=>{const code=daily.weather_code?.[i],temp=daily.temperature_2m_max?.[i],rain=daily.precipitation_probability_max?.[i];if(code==null||temp==null||rain==null)return;weatherCache.daily[date]={code:Number(code),temp:Math.round(Number(temp)),rain:Math.round(Number(rain))};const pill=document.querySelector(`[data-weather-date="${date}"]`);if(pill){pill.textContent=`${weatherIcon(Number(code))} ${Math.round(Number(temp))} °C · ${Math.round(Number(rain))} % Regen`;pill.classList.remove("pending")}});const hourly=data.hourly||{};(hourly.time||[]).forEach((stamp,i)=>{weatherCache.hourly[stamp]={code:hourly.weather_code?.[i],temp:hourly.temperature_2m?.[i],rain:hourly.precipitation_probability?.[i]}})}).catch(e=>console.warn(e.message))}
function getGameWeather(datum,zeit){const iso=isoDate(datum),hour=String(parseInt((zeit||"00:00").split(":")[0],10)||0).padStart(2,"0"),key=`${iso}T${hour}:00`,h=weatherCache.hourly[key];if(h&&h.code!=null&&h.temp!=null&&h.rain!=null)return{code:Number(h.code),temp:Math.round(Number(h.temp)),rain:Math.round(Number(h.rain)),exact:true};const d=weatherCache.daily[iso];return d?{...d,exact:false}:null}
function openModal(btn){const datum=btn.dataset.date||"",zeit=btn.dataset.time||"",typ=btn.dataset.type||"Spiel",heim=btn.dataset.home||"",gast=btn.dataset.away||"",info=btn.dataset.info||"",weather=getGameWeather(datum,zeit);document.getElementById("modalType").innerHTML=`<span>🏆</span><span>${escapeHtml(typ)}</span>`;let content=`<div class="modal-row"><span class="modal-row-icon">📅</span><span>${escapeHtml(datum)} · ${escapeHtml(zeit)} Uhr</span></div><div class="modal-teams"><div class="modal-team">${escapeHtml(heim)}</div><div class="modal-against">gegen</div><div class="modal-team">${escapeHtml(gast)}</div></div><div class="modal-row"><span class="modal-row-icon">📍</span><span>Sportanlage Stapfenwies</span></div>`;if(info.trim())content+=`<div class="info-box">${escapeHtml(info)}</div>`;content+=`<section class="weather-section"><div class="weather-title">Wettervorhersage zur Spielzeit</div>`;if(weather){content+=`<div class="weather-main"><div class="weather-big-icon">${weatherIcon(weather.code)}</div><div class="weather-temp">${weather.temp} °C</div><div class="weather-rain"><strong>${weather.rain} %</strong>Regenwahrscheinlichkeit</div></div><div class="weather-text">${weatherDescription(weather.code,weather.rain)}</div>`}else{content+=`<div class="weather-main"><div class="weather-big-icon">🌦️</div><div><strong>Wetter folgt</strong><div class="weather-text">Die Prognose ist für diesen Spieltag noch nicht verfügbar.</div></div></div>`}content+=`</section>`;document.getElementById("modalContent").innerHTML=content;document.getElementById("modalBackdrop").classList.add("show")}
function attachHandlers(){const backdrop=document.getElementById("modalBackdrop");document.body.addEventListener("click",e=>{const btn=e.target.closest(".detail-btn");if(btn)openModal(btn)});document.getElementById("modalClose").addEventListener("click",()=>backdrop.classList.remove("show"));backdrop.addEventListener("click",e=>{if(e.target===backdrop)backdrop.classList.remove("show")});document.addEventListener("keydown",e=>{if(e.key==="Escape")backdrop.classList.remove("show")})}
fetch(CSV_URL,{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("CSV nicht gefunden ("+r.status+")");return r.text()}).then(text=>{const rows=parseCsv(text),plan=document.getElementById("spielplan");plan.classList.remove("loading");plan.innerHTML=render(rows);attachHandlers();loadWeather()}).catch(error=>{const plan=document.getElementById("spielplan");plan.classList.remove("loading");plan.innerHTML=`<div class="error">Fehler beim Laden: ${escapeHtml(error.message)}</div>`})
</script>
</body>
</html>
